defaults:
  - transfer_experiment@experiment: D
  - _self_

action: pretrain
seed: 0
output_dir: runs/pose_transfer/${experiment.name}/${action}/seed-${seed}/${now:%Y%m%d-%H%M%S}
init_encoder: null
resume_from: null
checkpoint: null
label_fraction: 1.0
pretrain_steps: 40000
output_dim: 20
hidden_dim: 256
export_predictions: false

data:
  root: ???
  manifest: ${data.root}/splits.csv
  prepared: ${data.root}/pose_transfer_prepared.json
  max_gap_samples: 1.5
  exclude_train_counterparts: true
  window_ms: 1000
  stride_ms: 500
  eval_window_ms: 5000
  batch_size: 16
  num_workers: 4
  batches_per_epoch: 1000
  # 0=equal source probability; 1=natural window counts; .5=temperature sampling.
  source_alpha: 0.5

model:
  patch_samples: 40
  channel_dim: 16
  d_model: 256
  depth: 4
  heads: 8
  dropout: 0.1
  # Keep geometry a separate ablation, not an assumed contribution.
  ring_mixing: false

objective:
  spectral_bins: 8
  mask_ratio: 0.5
  block_tokens: 3
optimizer:
  learning_rate: 0.0003
  weight_decay: 0.01
  warmup_steps: 1000

trainer:
  accelerator: gpu
  devices: 1
  strategy: auto
  precision: bf16-mixed
  accumulate_grad_batches: 1
  gradient_clip_val: 1.0
  enable_progress_bar: false
  log_every_n_steps: 25
  num_sanity_val_steps: 2
  deterministic: true

hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}/hydra
